name: Generate playlist manually

# ⚠️注意：请不要在 fork 的仓库中添加 `on: schedule` 定时任务（cron）。
# 生成结果只能通过 Pages Artifact、每次运行独立的 Release 或外部端点发布，不得提交回 Git。
# 如需要频繁更新或定时执行，请使用 Docker、命令行、GUI 或外部对象存储。
#
# ⚠️NOTICE: Do NOT add `on: schedule` cron triggers in forked repositories.
# Publish generated results only through a Pages artifact, a per-run release, or an external endpoint; never commit them to Git.
# Use Docker, the CLI, the GUI, or external object storage for frequent or scheduled runs.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

permissions:
  contents: read

concurrency:
  group: playlist-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      pages_base_url: ${{ steps.generate.outputs.pages_base_url }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_title: ${{ steps.release.outputs.title }}
    steps:
      - name: Checkout source and configuration
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Load upstream configuration
        if: github.repository_owner == 'Guovin'
        run: |
          git fetch --depth=1 origin gd
          git archive FETCH_HEAD config | tar -x

      - name: Record checked-out revision and state key
        id: source
        env:
          CONFIG_HASH: ${{ hashFiles('config/**/*.ini', 'config/**/*.txt', 'config/**/*.m3u') }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "state_prefix=playlist-state-v1-${RUNNER_OS}-${CONFIG_HASH}-" >> "$GITHUB_OUTPUT"
          echo "state_key=playlist-state-v1-${RUNNER_OS}-${CONFIG_HASH}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/iptv-config-before"
          cp -a config/. "$RUNNER_TEMP/iptv-config-before/"

      - name: Remove generated files from the checkout
        run: rm -rf -- output release-assets

      - name: Restore result history
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            output/data/cache.gz
            output/data/frozen.gz
          key: ${{ steps.source.outputs.state_key }}
          restore-keys: ${{ steps.source.outputs.state_prefix }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          update-environment: true
          cache: pipenv

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv --python 3.14
          pipenv install --deploy

      - name: Generate playlist results
        id: generate
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          pages_base_url="${PAGES_BASE_URL%/}"
          echo "pages_base_url=$pages_base_url" >> "$GITHUB_OUTPUT"
          IPTV_API_ARTIFACT_BASE_URL="$pages_base_url" pipenv run dev

      - name: Sanitize playlist and normalize EPG
        run: |
          python - <<'SANEOF'
          import os
          import re
          import gzip
          import bisect
          import xml.etree.ElementTree as ET
          from datetime import datetime

          URL_HEAD = re.compile(r'^https?://', re.I)
          URL_FULL = re.compile(r'^https?://\S{4,}$', re.I)
          CH_NAME = re.compile(r'tvg-name="([^"]*)"')
          TIME14 = re.compile(r'(\d{14})')
          BAD_TITLE = ('未能提供', '敬请原谅')

          # 整条标题就是这个 -> 信息量为 0
          PURE_GENERIC = {
              '电视剧', '剧场', '电影', '生活服务', '精彩呈现', '栏目', '专题', '节目',
              '暂无', '敬请', '其他', '广告', '节目预告', '连续剧', '动画片', '综艺',
              '宣传', '导视', '垫片', '片花', '电视剧场', '精彩节目', '微短剧',
              '中国故事', '纪录片', '未提供', '节目单', '待定', '敬请期待', '敬请收看',
          }
          PREFIX_GENERIC = ('电视剧', '剧场', '电影', '动画片', '栏目', '专题',
                            '重播', '栏目剧', '宣传片', '导视')


          def title_rank(text):
              """2=具体节目名  1=泛词打头但后面有内容  0=纯泛词或空"""
              t = (text or '').strip()
              if not t:
                  return 0
              if t in PURE_GENERIC:
                  return 0
              if any(t.startswith(p) for p in PREFIX_GENERIC):
                  return 1
              return 2


          def parse_time(raw):
              m = TIME14.match(raw or '')
              return datetime.strptime(m.group(1), '%Y%m%d%H%M%S') if m else None


          def clean_url(raw):
              """只接受真正的 http(s) 网址；自动砍掉网址后面的说明文字与注释"""
              s = (raw or '').strip()
              if not s:
                  return None
              s = re.split(r'\s+', s)[0]
              if not URL_HEAD.match(s):
                  return None
              if '#' in s:
                  s = s.split('#')[0]
              if not URL_FULL.match(s):
                  return None
              return s


          def sanitize_m3u(path):
              """删除非法 url；整条没有有效 url 的条目一并删除"""
              lines = open(path, encoding='utf-8', errors='replace').read().splitlines()
              head, items, cur = [], [], None
              for ln in lines:
                  s = ln.strip()
                  if not s:
                      continue
                  if s.upper().startswith('#EXTM3U'):
                      head.append(s)
                      continue
                  if s.startswith('#EXTINF'):
                      if cur is not None:
                          items.append(cur)
                      cur = [s]
                      continue
                  if cur is None:
                      continue
                  if s.startswith('#'):
                      cur.append(s)
                  else:
                      u = clean_url(s)
                      if u:
                          cur.append(u)
              if cur is not None:
                  items.append(cur)

              kept, names = [], set()
              for it in items:
                  if any(not l.startswith('#') for l in it[1:]):
                      kept.append(it)
                      m = CH_NAME.search(it[0])
                      if m and m.group(1).strip():
                          names.add(m.group(1).strip())

              if items and not kept:
                  print('WARNING: m3u cleanup would empty the file, skipped')
                  return len(items), len(items), names

              out = head[:]
              for it in kept:
                  out.extend(it)
              open(path, 'w', encoding='utf-8', newline='\n').write('\n'.join(out) + '\n')
              return len(items), len(kept), names


          def sanitize_txt(path):
              """频道名,url 与 分组名,#genre# 两种行；非法 url 直接丢弃"""
              raw = open(path, encoding='utf-8', errors='replace').read().splitlines()
              rows, names = [], set()
              for ln in raw:
                  s = ln.strip()
                  if not s:
                      continue
                  if s.endswith(',#genre#'):
                      rows.append(s)
                      continue
                  name, sep, url = s.partition(',')
                  if not sep:
                      continue
                  u = clean_url(url)
                  if u:
                      name = name.strip()
                      rows.append('%s,%s' % (name, u))
                      names.add(name)

              cleaned = []
              for j, ln in enumerate(rows):
                  if ln.endswith(',#genre#'):
                      nxt = None
                      for x in rows[j + 1:]:
                          if x.endswith(',#genre#'):
                              break
                          nxt = x
                          break
                      if nxt is not None:
                          cleaned.append(ln)
                  else:
                      cleaned.append(ln)

              if rows and not cleaned:
                  print('WARNING: txt cleanup would empty the file, skipped')
                  return len(rows), len(rows), names
              open(path, 'w', encoding='utf-8', newline='\n').write('\n'.join(cleaned) + '\n')
              return len(rows), len([x for x in cleaned if not x.endswith(',#genre#')]), names


          def align_epg(path, keep_names):
              """删除占位符节目，并只保留播放列表里真实存在的频道"""
              tree = ET.parse(path)
              root = tree.getroot()

              ph = 0
              for prog in list(root.findall('programme')):
                  t = prog.find('title')
                  text = (t.text or '') if t is not None else ''
                  if any(k in text for k in BAD_TITLE):
                      root.remove(prog)
                      ph += 1

              ch_del, pr_del = 0, 0
              for ch in list(root.findall('channel')):
                  if ch.get('id') not in keep_names:
                      root.remove(ch)
                      ch_del += 1
              for prog in list(root.findall('programme')):
                  if prog.get('channel') not in keep_names:
                      root.remove(prog)
                      pr_del += 1

              ET.indent(tree, space='\t')
              tree.write(path, encoding='utf-8', xml_declaration=True)
              for gz in (os.path.join(os.path.dirname(path), 'epg.gz'), path + '.gz'):
                  if os.path.exists(gz):
                      with open(path, 'rb') as fin, gzip.open(gz, 'wb') as fout:
                          fout.write(fin.read())
              print('EPG: placeholder programmes -%d | ghost channels -%d | orphan programmes -%d | left channels %d'
                    % (ph, ch_del, pr_del, len(root.findall('channel'))))


          def measure(rows):
              """返回 (具体标题条数, 纯泛词条数, 时间线空洞秒)"""
              bych = {}
              for s, e, text, prog in rows:
                  bych.setdefault(prog.get('channel'), []).append((s, e, title_rank(text)))
              detail = generic = 0
              gap = 0.0
              for lst in bych.values():
                  lst.sort()
                  cur = None
                  for s, e, r in lst:
                      if r == 2:
                          detail += 1
                      elif r == 0:
                          generic += 1
                      if cur is None:
                          cur = e
                      elif s > cur:
                          gap += (s - cur).total_seconds()
                          cur = e
                      elif e > cur:
                          cur = e
              return detail, generic, gap


          def dedupe_epg(path):
              """同一频道只保留一条互不重叠的时间线。

              iptv-api 的节目单合并键是 (start, stop) 精确到秒，几个源只要
              起止时间差一分钟就会各留一套时间线叠在一起。播放器读到哪条算哪条，
              于是同一时段既可能出现"星月征途 第12集"，也可能出现"电视剧"。

              这里按频道整体重排（不按天切分，跨零点也不会断开），
              用加权区间调度求最优解，目标优先级：
                ① 具体标题覆盖时长最大（泛词不许盖住同时间的具体节目名）
                ② 总覆盖时长最大（尽量不留空洞）
                ③ 标题信息量之和最大
              """
              tree = ET.parse(path)
              root = tree.getroot()

              buckets = {}
              for prog in list(root.findall('programme')):
                  s = parse_time(prog.get('start'))
                  e = parse_time(prog.get('stop'))
                  t = prog.find('title')
                  text = (t.text or '') if t is not None else ''
                  if s is None or e is None or e <= s:
                      root.remove(prog)
                      continue
                  buckets.setdefault(prog.get('channel'), []).append((s, e, text, prog))

              all_rows = [x for v in buckets.values() for x in v]
              before = len(all_rows)
              if not before:
                  print('EPG dedup: no programme found, skipped')
                  return

              kept = []
              for items in buckets.values():
                  v = sorted(items, key=lambda x: (x[1], x[0]))
                  ends = [x[1] for x in v]
                  n = len(v)
                  prev = [bisect.bisect_right(ends, v[i][0]) - 1 for i in range(n)]
                  best = [(0, 0, 0)] * (n + 1)
                  take = [False] * (n + 1)
                  for i in range(1, n + 1):
                      s, e, text, _ = v[i - 1]
                      dur = int((e - s).total_seconds())
                      r = title_rank(text)
                      base = best[prev[i - 1] + 1]
                      cand = (base[0] + (dur if r == 2 else 0),
                              base[1] + dur,
                              base[2] + r)
                      if cand > best[i - 1]:
                          best[i] = cand
                          take[i] = True
                      else:
                          best[i] = best[i - 1]
                  i = n
                  while i > 0:
                      if take[i]:
                          kept.append(v[i - 1])
                          i = prev[i - 1] + 1
                      else:
                          i -= 1

              kept.sort(key=lambda x: (x[3].get('channel'), x[0]))
              for prog in list(root.findall('programme')):
                  root.remove(prog)
              for row in kept:
                  root.append(row[3])

              det_b, gen_b, _ = measure(all_rows)
              det_a, gen_a, gap_a = measure(kept)
              after = len(kept)

              ET.indent(tree, space='\t')
              tree.write(path, encoding='utf-8', xml_declaration=True)
              for gz in (os.path.join(os.path.dirname(path), 'epg.gz'), path + '.gz'):
                  if os.path.exists(gz):
                      with open(path, 'rb') as fin, gzip.open(gz, 'wb') as fout:
                          fout.write(fin.read())

              print('EPG dedup: programmes %d -> %d (-%.0f%%) | '
                    '具体标题占比 %.1f%% -> %.1f%% | 纯泛词 %d -> %d 条 | '
                    '时间线空洞 %.1fh'
                    % (before, after, 100.0 * (before - after) / before,
                       100.0 * det_b / before, 100.0 * det_a / after,
                       gen_b, gen_a, gap_a / 3600))


          names = set()

          m3u_path = 'output/result.m3u'
          if os.path.exists(m3u_path):
              a, b, n = sanitize_m3u(m3u_path)
              names |= n
              print('M3U: entries %d -> %d (dropped %d invalid/empty), channels %d' % (a, b, a - b, len(n)))

          txt_path = 'output/result.txt'
          if os.path.exists(txt_path):
              a, b, n = sanitize_txt(txt_path)
              names |= n
              print('TXT: rows %d -> %d, channels %d' % (a, b, len(n)))

          if not names:
              print('No usable channel found, skip EPG alignment')
              raise SystemExit(0)

          for epg_path in ('output/epg/epg.xml', 'output/epg.xml'):
              if os.path.exists(epg_path):
                  align_epg(epg_path, names)
                  dedupe_epg(epg_path)
          print('Keep %d channel names in total' % len(names))
          SANEOF

      - name: Create release metadata
        id: release
        run: |
          mapfile -t release_metadata < <(
            pipenv run python -c 'from scripts.publish_results import build_release_metadata; from utils.config import config; metadata = build_release_metadata(config.time_zone); print(metadata["tag"]); print(metadata["title"]); print(metadata["generated_at"])'
          )
          echo "tag=${release_metadata[0]}" >> "$GITHUB_OUTPUT"
          echo "title=${release_metadata[1]}" >> "$GITHUB_OUTPUT"
          echo "generated_at=${release_metadata[2]}" >> "$GITHUB_OUTPUT"

      - name: Prepare public release assets
        id: assets
        run: |
          final_file="$(pipenv run python -c 'from utils.config import config; print(config.final_file)')"
          pipenv run python scripts/publish_results.py \
            --final-file "$final_file" \
            --destination release-assets \
            --generated-at "${{ steps.release.outputs.generated_at }}" \
            --release-tag "${{ steps.release.outputs.tag }}" \
            --pages-destination pages-site \
            --pages-base-url "${{ steps.generate.outputs.pages_base_url }}"
          echo "final_file=$final_file" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-release-assets-${{ steps.release.outputs.tag }}
          path: release-assets
          if-no-files-found: error
          retention-days: 1

      - name: Report non-persistent configuration changes
        run: |
          if ! diff -qr "$RUNNER_TEMP/iptv-config-before" config >/dev/null; then
            echo "::warning::The update changed files under config/. These changes are not committed by the workflow."
            {
              echo "### Configuration notice"
              echo
              echo "The update changed files under \`config/\` (for example through automatic source disabling)."
              echo "The workflow intentionally did not commit those changes. Use Docker, CLI, or the GUI when this state must persist."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check that Git history was not changed
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Detect reusable result state
        id: result-state
        run: |
          if [[ -f output/data/cache.gz || -f output/data/frozen.gz ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save result history
        if: steps.result-state.outputs.available == 'true' && steps.restore-state.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            output/data/cache.gz
            output/data/frozen.gz
          key: ${{ steps.source.outputs.state_key }}

      - name: Add subscription links to summary
        env:
          PAGES_BASE: ${{ steps.generate.outputs.pages_base_url }}
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}
        run: |
          {
            echo "### Published playlist"
            echo
            echo "在线链接 / Online links"
            echo "- Pages TXT: $PAGES_BASE/result.txt"
            if [[ -f release-assets/result.m3u ]]; then
              echo "- Pages M3U: $PAGES_BASE/result.m3u"
            fi
            if [[ -f release-assets/epg.gz ]]; then
              echo "- Pages EPG: $PAGES_BASE/epg.gz"
            fi
            echo
            echo "下载链接 / Download links"
            echo "- Release TXT: $RELEASE_BASE/result.txt"
            if [[ -f release-assets/result.m3u ]]; then
              echo "- Release M3U: $RELEASE_BASE/result.m3u"
            fi
            if [[ -f release-assets/epg.gz ]]; then
              echo "- Release EPG: $RELEASE_BASE/epg.gz"
            fi
            echo
            echo "Generated from \`${{ steps.assets.outputs.final_file }}\` without creating a Git commit."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: playlist-release-assets-${{ needs.generate.outputs.release_tag }}
          path: release-assets

      - name: Publish playlist release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_BASE: ${{ needs.generate.outputs.pages_base_url }}
          RELEASE_TAG: ${{ needs.generate.outputs.release_tag }}
          RELEASE_TITLE: ${{ needs.generate.outputs.release_title }}
          SOURCE_SHA: ${{ needs.generate.outputs.source_sha }}
        run: |
          release_title="$RELEASE_TITLE"
          pages_link="<a href=\"$PAGES_BASE\" target=\"_blank\" rel=\"noopener noreferrer\">打开 GitHub Pages 结果页面 / Open GitHub Pages results page</a>"
          printf -v release_notes '%s\n\n%s\n\n%s' \
            "手动生成的 IPTV 结果。播放器在线使用请打开 GitHub Pages 页面获取相应的结果地址；Release 附件用于下载和保存结果文件。" \
            "Manually generated IPTV results. For online player use, open the GitHub Pages page and use the applicable result address; Release assets are for downloading and saving result files." \
            "$pages_link"
          if [[ "$GITHUB_REPOSITORY" == "Guovin/iptv-api" ]]; then
            printf -v release_notes '%s\n\n%s\n\n%s' \
              "主仓库发布的 Pages 链接和 Release 结果仅用于功能测试，不保证内容完整性、可用性或持续更新。实际使用请 [Fork 项目](https://github.com/Guovin/iptv-api/fork) 并运行自己的工作流。" \
              "Pages links and Release results from the upstream repository are for functional testing only. Content completeness, availability, and continued updates are not guaranteed. For actual use, [Fork the project](https://github.com/Guovin/iptv-api/fork) and run your own workflow." \
              "$pages_link"
          fi

          mapfile -d '' local_assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$RELEASE_TAG" "${local_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$release_title" \
            --notes "$release_notes" \
            --prerelease

          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/local-assets.txt
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort > /tmp/remote-assets.txt
          diff -u /tmp/local-assets.txt /tmp/remote-assets.txt
